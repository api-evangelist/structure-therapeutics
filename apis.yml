name: Structure Therapeutics
description: 'Structure Therapeutics (NASDAQ: GPCR) is a clinical-stage biopharmaceutical
  company headquartered in South San Francisco, California, developing novel oral
  small-molecule medicines for chronic diseases with significant unmet medical need.
  The company applies a structure-based drug discovery platform focused on G protein-coupled
  receptors (GPCRs) to design once-daily oral therapies, with lead programs centered
  on oral small-molecule GLP-1 receptor agonists for obesity and metabolic disease.
  This is a company profile in the API Evangelist network; Structure Therapeutics maintains
  a corporate and investor web presence, but no public developer API surface was found
  during enrichment.'
